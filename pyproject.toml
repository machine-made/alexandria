[project]
name = "alexandria"
version = "0.1.0"
description = "A local research library for AI agents: books and papers as Markdown, indexed by citation key, searchable over MCP."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
# Embedded PDF metadata (alexandria_pdf_meta.py). Not needed for Markdown intake or search.
pdf = ["pypdf>=6,<7"]

[tool.uv]
package = false
# Security audit 2026-10-21: resolve only releases at least 7 days old. Kept in the file so CI
# resolves the same way as the lock file (the lock was made with the same setting in the user config).
exclude-newer = "7 days"
